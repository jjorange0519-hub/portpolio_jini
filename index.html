<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>포트폴리오</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="page">

    <!-- 흰 큰 카드 -->
    <section class="sheet">

      <!-- 왼쪽: ABOUT ME -->
      <aside class="about">
        <h2 class="side-title">ABOUT ME</h2>

        <div class="photo" id="photo">
          <svg class="photo-empty" viewBox="0 0 24 24" aria-hidden="true">
            <circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.4 3.6-8 8-8s8 3.6 8 8z"/>
          </svg>
        </div>

        <h1 class="name" id="name"></h1>
        <p class="job-title" id="job-title"></p>
        <p class="badge" id="career-badge"></p>

        <ul class="contact">
          <li>
            <span class="icon" aria-hidden="true">
              <svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.4 3.6-8 8-8s8 3.6 8 8z"/></svg>
            </span>
            <div><small>NAME</small><span id="contact-name"></span></div>
          </li>
          <li>
            <span class="icon" aria-hidden="true">
              <svg viewBox="0 0 24 24"><path d="M3 6h18v12H3z" fill="none" stroke="currentColor" stroke-width="2"/><path d="M3 6l9 7 9-7" fill="none" stroke="currentColor" stroke-width="2"/></svg>
            </span>
            <div><small>EMAIL</small><span id="contact-email"></span></div>
          </li>
          <li>
            <span class="icon" aria-hidden="true">
              <svg viewBox="0 0 24 24"><path d="M6.6 10.8a15 15 0 0 0 6.6 6.6l2.2-2.2a1 1 0 0 1 1-.25 11.4 11.4 0 0 0 3.6.57 1 1 0 0 1 1 1V20a1 1 0 0 1-1 1A17 17 0 0 1 3 4a1 1 0 0 1 1-1h3.5a1 1 0 0 1 1 1c0 1.25.2 2.45.57 3.6a1 1 0 0 1-.25 1z"/></svg>
            </span>
            <div><small>PHONE</small><span id="contact-phone"></span></div>
          </li>
          <li>
            <span class="icon" aria-hidden="true">
              <svg viewBox="0 0 24 24"><path d="M12 2a7 7 0 0 0-7 7c0 5.2 7 13 7 13s7-7.8 7-13a7 7 0 0 0-7-7zm0 9.5A2.5 2.5 0 1 1 12 6.5a2.5 2.5 0 0 1 0 5z"/></svg>
            </span>
            <div><small>LOCATION</small><span id="contact-location"></span></div>
          </li>
        </ul>
      </aside>

      <!-- 오른쪽: PORTFOLIO -->
      <div class="content">
        <h2 class="main-title">PORTFOLIO</h2>

        <h3 class="headline" id="headline"></h3>
        <p class="intro" id="intro"></p>

        <div class="info-grid">
          <div class="info">
            <h4>
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3L1 9l11 6 9-4.9V17h2V9z"/><path d="M5 13.2v4L12 21l7-3.8v-4L12 17z"/></svg>
              EDUCATION
            </h4>
            <p id="education"></p>
          </div>
          <div class="info">
            <h4>
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M22.7 19l-9.1-9.1c.9-2.3.4-5-1.5-6.9-2-2-5-2.4-7.4-1.3L9 6 6 9 1.6 4.7C.4 7.1.9 10.1 2.9 12.1c1.9 1.9 4.6 2.4 6.9 1.5l9.1 9.1c.4.4 1 .4 1.4 0l2.3-2.3c.5-.4.5-1.1.1-1.4z"/></svg>
              SKILLS &amp; TOOLS
            </h4>
            <p id="skills"></p>
          </div>
          <div class="info">
            <h4>
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M10 4h4a2 2 0 0 1 2 2v1h4a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V9a2 2 0 0 1 2-2h4V6a2 2 0 0 1 2-2zm0 3h4V6h-4z"/></svg>
              EXPERIENCE
            </h4>
            <p id="experience"></p>
          </div>
        </div>

        <div class="highlights">
          <h4 class="box-title">PORTFOLIO HIGHLIGHTS</h4>
          <div class="cards" id="cards"></div>
        </div>

        <p class="quote" id="quote"></p>
      </div>
    </section>

    <!-- 방명록 -->
    <section class="sheet guestbook">
      <h2 class="main-title">GUESTBOOK</h2>

      <div class="gb-form">
        <input type="text" id="gb-nickname" placeholder="별명 (20자까지)" maxlength="20">
        <input type="text" id="gb-message" placeholder="한마디 남겨 주세요 (200자까지)" maxlength="200">
        <button type="button" id="gb-submit">남기기</button>
      </div>
      <p class="gb-status" id="gb-status"></p>

      <ul class="gb-list" id="gb-list"></ul>
    </section>

  </main>

  <script src="script.js"></script>
</body>
</html>
