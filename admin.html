<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>관리자 | 포트폴리오</title>
  <link rel="stylesheet" href="style.css">
  <style>
    /* ===== 관리자 화면에만 쓰는 모양 (색·글꼴은 style.css 것을 그대로 씀) ===== */
    .admin-box {
      display: block;
      padding: 40px 48px;
      margin-top: 24px;
    }
    .page > .admin-box { margin-top: 0; }
    .login-box a { color: var(--gray); font-size: 14px; }
    .admin-box .main-title { margin-bottom: 24px; }
    .admin-box h3 { font-size: 18px; margin-bottom: 16px; }
    [hidden] { display: none !important; }

    .admin-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      flex-wrap: wrap;
    }
    .admin-top .main-title { margin-bottom: 0; }
    .admin-user { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; color: var(--gray); font-size: 14px; }
    .admin-user a { color: var(--blue); font-weight: 700; text-decoration: none; }

    .fields { display: grid; grid-template-columns: repeat(2, 1fr); gap: 14px 16px; }
    .field { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
    .field.wide { grid-column: 1 / -1; }
    .field label { font-size: 13px; font-weight: 700; }
    .field small { font-size: 12px; color: var(--gray); }
    .field input[type="text"],
    .field input[type="email"],
    .field input[type="password"],
    .field textarea {
      font: inherit;
      padding: 11px 14px;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: var(--bg);
      width: 100%;
    }
    .field textarea { min-height: 96px; resize: vertical; }
    .field input:focus, .field textarea:focus { outline: 2px solid var(--blue); background: var(--white); }
    .field input[type="file"] { font: inherit; font-size: 14px; }

    .current { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; font-size: 13px; }
    .current a { color: var(--blue); word-break: break-all; }
    .current img { width: 64px; height: 64px; object-fit: cover; border-radius: 12px; background: #e3e6eb; }

    .btn {
      font: inherit;
      font-size: 14px;
      font-weight: 700;
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 8px 14px;
      background: var(--white);
      color: var(--text);
      cursor: pointer;
      white-space: nowrap;
    }
    .btn:hover { background: var(--bg); }
    .btn:disabled { opacity: 0.5; cursor: default; }
    .btn.primary { background: var(--blue); border-color: var(--blue); color: var(--white); }
    .btn.primary:hover { background: #1d4ed8; }
    .btn.danger { color: #dc2626; border-color: #fecaca; }
    .btn.danger:hover { background: #fef2f2; }
    .btn.small { font-size: 12px; padding: 5px 10px; }

    .actions { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin-top: 20px; }
    .status { font-size: 13px; color: var(--gray); min-height: 20px; }
    .status.error { color: #dc2626; }

    #not-admin { margin-top: 20px; font-size: 16px; font-weight: 700; color: #dc2626; }
    .login-box { max-width: 440px; margin: 0 auto; }
    .login-box .fields { grid-template-columns: 1fr; }

    /* 카드 목록 */
    .pj-list { list-style: none; padding: 0; margin: 0; display: grid; gap: 12px; }
    .pj-item {
      display: grid;
      grid-template-columns: 72px 1fr auto;
      gap: 16px;
      align-items: center;
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 12px;
    }
    .pj-thumb { width: 72px; height: 54px; border-radius: 8px; background: #e3e6eb; object-fit: cover; display: block; }
    .pj-info { min-width: 0; }
    .pj-meta { font-size: 12px; font-weight: 700; color: var(--blue); }
    .pj-title { font-weight: 800; }
    .pj-likes { font-size: 13px; color: var(--gray); }
    .pj-likes b { color: #e11d48; }
    .pj-buttons { display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; }

    .editor {
      margin-top: 20px;
      border: 1px solid var(--line);
      border-radius: 20px;
      padding: 24px;
      background: var(--white);
    }

    /* 방명록 목록 */
    .admin-gb li { display: flex; gap: 16px; align-items: flex-start; justify-content: space-between; }
    .admin-gb li > div { min-width: 0; }

    @media (max-width: 760px) {
      .admin-box { padding: 28px 20px; margin-top: 16px; }
      .fields { grid-template-columns: 1fr; }
      .pj-item { grid-template-columns: 56px 1fr; }
      .pj-thumb { width: 56px; height: 42px; }
      .pj-buttons { grid-column: 1 / -1; justify-content: flex-start; }
      .editor { padding: 16px; }
    }
  </style>
</head>
<body>
  <main class="page">

    <!-- 로그인 -->
    <section class="sheet admin-box" id="login-view" hidden>
      <div class="login-box">
        <h2 class="main-title">ADMIN</h2>
        <div class="fields">
          <div class="field">
            <label for="login-email">이메일</label>
            <input type="email" id="login-email" autocomplete="username">
          </div>
          <div class="field">
            <label for="login-password">비밀번호</label>
            <input type="password" id="login-password" autocomplete="current-password">
          </div>
        </div>
        <div class="actions">
          <button type="button" class="btn primary" id="login-button">로그인</button>
          <a href="index.html">방문자 화면으로</a>
        </div>
        <p class="status" id="login-status"></p>
      </div>
    </section>

    <!-- 로그인 후 위쪽 막대 -->
    <section class="sheet admin-box" id="top-view" hidden>
      <div class="admin-top">
        <h2 class="main-title">ADMIN</h2>
        <div class="admin-user">
          <span id="user-email"></span>
          <a href="index.html" target="_blank" rel="noopener">방문자 화면 보기</a>
          <button type="button" class="btn" id="logout-button">로그아웃</button>
        </div>
      </div>
      <p class="status" id="not-admin" hidden>관리자만 쓸 수 있어요.</p>
    </section>

    <!-- 관리자만 보는 부분 -->
    <div id="admin-view" hidden>

      <!-- 프로필 -->
      <section class="sheet admin-box">
        <h2 class="main-title">PROFILE</h2>
        <div class="fields">
          <div class="field wide">
            <label for="pf-photo">프로필 사진</label>
            <div class="current">
              <img id="pf-photo-preview" alt="" hidden>
              <span id="pf-photo-none">사진이 없어요.</span>
            </div>
            <input type="file" id="pf-photo" accept="image/png,image/jpeg,image/webp,image/gif">
            <small>이미지(PNG·JPG·WEBP·GIF), 10MB까지. 고르고 저장을 누르면 올라가요.</small>
          </div>
          <div class="field"><label for="pf-name">이름</label><input type="text" id="pf-name"></div>
          <div class="field"><label for="pf-title">직함</label><input type="text" id="pf-title"></div>
          <div class="field"><label for="pf-career_badge">경력 배지</label><input type="text" id="pf-career_badge"></div>
          <div class="field"><label for="pf-email">이메일</label><input type="text" id="pf-email"></div>
          <div class="field"><label for="pf-phone">연락처</label><input type="text" id="pf-phone"></div>
          <div class="field"><label for="pf-location">위치</label><input type="text" id="pf-location"></div>
          <div class="field wide">
            <label for="pf-headline">한 줄 소개 제목</label>
            <input type="text" id="pf-headline">
            <small>이 글 안의 이름에 파란 밑줄이 그어져요.</small>
          </div>
          <div class="field wide"><label for="pf-intro">소개 글</label><textarea id="pf-intro"></textarea></div>
          <div class="field wide"><label for="pf-education">EDUCATION</label><textarea id="pf-education"></textarea></div>
          <div class="field wide"><label for="pf-skills">SKILLS &amp; TOOLS</label><textarea id="pf-skills"></textarea></div>
          <div class="field wide"><label for="pf-experience">EXPERIENCE</label><textarea id="pf-experience"></textarea></div>
          <div class="field wide"><label for="pf-quote">맨 아래 인용</label><input type="text" id="pf-quote"></div>
        </div>
        <div class="actions">
          <button type="button" class="btn primary" id="pf-save">프로필 저장</button>
          <p class="status" id="pf-status"></p>
        </div>
      </section>

      <!-- 포트폴리오 카드 -->
      <section class="sheet admin-box">
        <h2 class="main-title">PORTFOLIO</h2>
        <ul class="pj-list" id="pj-list"></ul>
        <div class="actions">
          <button type="button" class="btn primary" id="pj-add">카드 추가</button>
          <p class="status" id="pj-status"></p>
        </div>

        <!-- 카드 추가·수정 칸 -->
        <div class="editor" id="pj-editor" hidden>
          <h3 id="pj-editor-title">카드 추가</h3>
          <div class="fields">
            <div class="field"><label for="pj-number">번호</label><input type="text" id="pj-number" placeholder="예: 01"></div>
            <div class="field"><label for="pj-category">분류</label><input type="text" id="pj-category"></div>
            <div class="field wide"><label for="pj-title">제목 (꼭 적기)</label><input type="text" id="pj-title"></div>
            <div class="field wide"><label for="pj-description">설명</label><textarea id="pj-description"></textarea></div>
            <div class="field wide">
              <label for="pj-tags">태그</label>
              <input type="text" id="pj-tags" placeholder="쉼표(,)로 나눠 적기. 예: 총괄 PM, UI/UX">
            </div>
            <div class="field wide">
              <label for="pj-thumb">썸네일 이미지</label>
              <div class="current" id="pj-thumb-current"></div>
              <input type="file" id="pj-thumb" accept="image/png,image/jpeg,image/webp,image/gif">
              <small>이미지(PNG·JPG·WEBP·GIF), 10MB까지.</small>
            </div>
            <div class="field wide">
              <label for="pj-file">첨부 파일</label>
              <div class="current" id="pj-file-current"></div>
              <input type="file" id="pj-file" accept="image/png,image/jpeg,image/webp,image/gif,application/pdf">
              <small>이미지나 PDF, 10MB까지. 카드를 누르면 이 파일이 열려요.</small>
            </div>
          </div>
          <div class="actions">
            <button type="button" class="btn primary" id="pj-save">저장</button>
            <button type="button" class="btn" id="pj-cancel">취소</button>
            <p class="status" id="pj-editor-status"></p>
          </div>
        </div>
      </section>

      <!-- 방명록 -->
      <section class="sheet admin-box">
        <h2 class="main-title">GUESTBOOK</h2>
        <p class="status" id="gb-status"></p>
        <ul class="gb-list admin-gb" id="gb-list"></ul>
      </section>
    </div>

  </main>

  <script src="admin.js"></script>
</body>
</html>
